<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="starbuzz.css" />
    <link rel="stylesheet" href="stylefillout.css" />
    <title>Starbuzz Bean Machine</title>
  </head>
  <body>
    <h1>The Starbuzz Bean Machine</h1>
    <h2>Fill out the form below and click "order now" to order</h2>

    <form action="" method="post">
      <div class="tablerow">
        <p>Choose your beans:</p>
        <p>
          <select name="beans">
            <option value="House Blend">House Blend</option>
            <option value="Bolivia">Shade Grown Bolivia Supremo</option>
            <option value="Guatemala">Organic Guatemala</option>
            <option value="Kenya">Kenya</option>
          </select>
        </p>
      </div>

      <div class="tablerow">
        <p>Type:</p>
        <p>
          <input type="radio" name="beantype" value="whole" id="whole" />
          <label for="whole">Whole bean</label>
          <br />
          <input
            type="radio"
            name="beantype"
            value="ground"
            id="ground"
            checked
          />
          <label for="ground">Ground</label>
        </p>
      </div>

      <div class="tablerow">
        <label for="bags">Number of bags:</label>
        <p>
          <input type="number" id="bags" name="bags" min="1" max="10" />
        </p>
      </div>

      <div class="tablerow">
        <p>Must arrive by date:</p>
        <p>
          <input type="date" name="date" />
        </p>
      </div>

      <div class="tablerow">
        <p>Extras:</p>
        <p>
          <input type="checkbox" name="extras[]" value="giftwrap" /> Gift Wrap
          <br />
          <input type="checkbox" name="extras[]" value="catalog" checked />
          Include catalog with order
        </p>
      </div>

      <div class="tablerow">
        <p class="heading">Ship to:</p>
        <p></p>
      </div>

      <div class="tablerow">
        <p>Name:</p>
        <p><input type="text" name="name" /></p>
      </div>
      <div class="tablerow">
        <p>Address:</p>
        <p><input type="text" name="address" /></p>
      </div>
      <div class="tablerow">
        <p>City:</p>
        <p><input type="text" name="city" /></p>
      </div>
      <div class="tablerow">
        <p>State:</p>
        <p><input type="text" name="state" /></p>
      </div>
      <div class="tablerow">
        <p>Zip:</p>
        <p><input type="text" name="zip" /></p>
      </div>
      <div class="tablerow">
        <p>Phone:</p>
        <p><input type="tel" name="phone" /></p>
      </div>

      <div class="tablerow">
        <p>Customer Comments:</p>
        <p>
          <textarea name="comments" cols="48" rows="10"></textarea>
        </p>
      </div>

      <div class="tablerow">
        <p></p>
        <p>
          <input type="submit" value="Order Now" />
        </p>
      </div>
    </form>
  </body>
</html>
